- type: entity
  id: DishMultistructCore
  parent: [ MultistructBaseCore , BaseComputerAiAccess ]
  name: DishMultistructCoreName
  description: DishMultistructCoreNameDesc
  components:
  #- type: ServerClientLinkInfrastructureExtendedName
  - type: MultiBlockPart
    structureType: 
    - SignalDishControll
    allowedConnectionTypesNorth:
    - ALL
    allowedConnectionTypesEast:
    - ALL
    allowedConnectionTypesSouth:
    - ALL
    allowedConnectionTypesWest:
    - ALL
  - type: MultiBlockStructure
    allowedTypes:
    - DishConnector
    - SignalDish
    - EnergyTransfair
    - EnergyCapacityProvider
    - Productivity
  - type: SignalSciDish
  - type: ActivatableUI
    key: enum.DishConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DishConsoleUiKey.Key:
        type: DishControllMenuUserInterface
      enum.ServerClientUiKey.Key:
        type: ServerClientLinkBoundUserInterface

- type: entity
  id: DishMultistructSignalDish
  parent: [ MultistructPartBase , BaseComputerAiAccess]
  name: DishMultistructSignalDishName
  description: DishMultistructSignalDishDesc
  components:
  - type: MultiBlockPart
    transmissionEfficency: 0.5
    structureType: 
    - SignalDish
    allowedConnectionTypesNorth:
    - DishConnector
    allowedConnectionTypesEast:
    - DishConnector
    allowedConnectionTypesSouth:
    - DishConnector
    allowedConnectionTypesWest:
    - DishConnector


- type: entity
  id: DishMultistructConnector
  parent: [ BaseComputerAiAccess]
  name: DishMultistructConnectorName
  description: DishMultistructConnectorDesc
  components:
  - type: MultiBlockPart
    transmissionEfficency: 1
    structureType: 
    - DishConnector
    allowedConnectionTypesNorth:
    - ALL
    allowedConnectionTypesEast:
    - ALL
    allowedConnectionTypesSouth:
    - ALL
    allowedConnectionTypesWest:
    - ALL