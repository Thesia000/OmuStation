- type: entity
  id: MaterialSiloMultistructCore
  parent: [ MultistructBaseCore , BaseComputerAiAccess ]
  name: StationServerCoreName
  description: StationServerMultistructCoreDesc
  components:
  - type: IngameServerClientLinkInfrastructure
  - type: IngameConsole
    allowedTypes:
    - ICC_ASSIGN
    - ICC_Print
  - type: SignalSalvMaterialReciverStructure
  - type: MaterialStorage
    ignoreColor: true
    StorageCapPerMaterialDefaultValue: 10000
  - type: Silo
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 1000
  - type: DeviceLinkSource
    range: 1000
    ports:
      - MaterialSilo
  - type: MultiBlockPart
    structureType: 
    - MaterialSiloStructureCore
    allowedConnectionTypesNorth:
    - ALL
    allowedConnectionTypesEast:
    - ALL
    allowedConnectionTypesSouth:
    - ALL
    allowedConnectionTypesWest:
    - ALL
  - type: MultiBlockStructure
    allowedTypes:
    - MaterialSiloReciver
    - MaterialSiloStorageExtender
  - type: ActivatableUI
    key: enum.IngameConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.IngameConsoleUiKey.Key:
        type: IngameConsoleBoundUserInterface