#
# Tier 1 materials
#
- type: entity
  parent: [ MultistructPartBase ]
  id: MaterialSiloMultistructStorageSteel
  name: MaterialSiloMultistructStorageSteelName
  description: MaterialSiloMultistructStorageSteelDesc
  components:
  - type: Sprite
    sprite: _BSD/Structures/OmnidirectionalDetector.rsi
    layers:
    - state: hullPlaceHolder
  - type: IngameServerPointCapacity
    CapacityExpansion:
      Steel: 10000 #100 additional sheets
  - type: MultiBlockPart
    transmissionEfficency: 1
    structureType: 
    - MaterialSiloStructureStorageHolder
    allowedConnectionTypesNorth:
    - MaterialSiloStructureStorageHolder
    allowedConnectionTypesEast:
    - NONE
    allowedConnectionTypesSouth:
    - MaterialSiloStructureStorageHolder
    allowedConnectionTypesWest:
    - NONE

