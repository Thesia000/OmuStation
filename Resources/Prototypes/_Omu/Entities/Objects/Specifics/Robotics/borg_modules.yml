# NT Modules

- type: entity
  id: BorgModuleERTMed
  parent: [ BaseBorgModule, BaseProviderBorgModule, BaseCentcommContraband ]
  name: ERT medical cyborg module
  suffix: DO NOT MAP
  description: A module that comes with a ERT levels of medical help.
  components:
    - type: Sprite
      layers:
      - state: nanotressen
        sprite: _Omu/Objects/Specific/Robotics/borgmodule_additional.rsi
      - state: icon-nanotressen
        sprite: _Omu/Objects/Specific/Robotics/borgmodule_additional.rsi
    - type: ItemBorgModule
      moduleId: BorgModuleERTMed
      items:
        - CentCommHypo
        - EnergyScalpel
        - EnergyCautery
        - AdvancedRetractor
        - BoneGel
        - WeaponPulsePistol
    - type: BorgModuleIcon
      icon: { sprite: Interface/Actions/actions_borg.rsi, state: ERT-med-module }

